<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Reload Messenger</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
</head>
<body>
    <div id="login-form" class="login-overlay">
        <div class="login-card">
            <h2>Вход / Регистрация</h2>
            <input type="text" id="username" placeholder="Имя пользователя">
            <input type="password" id="password" placeholder="Пароль">
            <div id="register-fields" style="display: none;">
                <input type="text" id="first-name" placeholder="Имя">
                <input type="text" id="last-name" placeholder="Фамилия">
                <input type="text" id="nickname" placeholder="Никнейм (@)">
                <input type="number" id="birth-year" placeholder="Год рождения">
            </div>
            <div class="login-buttons">
                <button id="show-register-fields" class="secondary-btn">Регистрация</button>
                <button id="login-btn" class="primary-btn">Войти</button>
            </div>
        </div>
    </div>

    <div id="app" style="display: none;">
        <div id="loading-overlay" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 12px 20px; border-radius: 30px; z-index: 10000; display: none;">
            Загрузка...
        </div>
        <div class="messenger-container">
            <aside class="chats-panel" id="chats-panel">
                <div class="user-info">
                    <div class="avatar" id="user-avatar-clickable" style="cursor: pointer;">
                        <i class="fas fa-user-circle fa-2x" id="avatar-icon"></i>
                        <img id="avatar-img" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; display: none;">
                    </div>
                    <div class="user-name" id="username-clickable" style="cursor: pointer;">
                        <div id="display-name"></div>
                        <div id="nickname-display" style="font-size: 12px; opacity: 0.7;"></div>
                    </div>
                    <div class="panel-actions">
                        <button id="terminal-toggle" class="icon-btn"><i class="fas fa-terminal"></i></button>
                        <button id="timeline-btn" class="icon-btn"><i class="fas fa-chart-line"></i></button>
                        <button id="settings-btn" class="icon-btn"><i class="fas fa-cog"></i></button>
                        <button onclick="window.auth.logout()" class="icon-btn"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
                <div class="chats-actions">
                    <button id="new-group-btn" class="primary-btn full-width"><i class="fas fa-plus"></i> Новая группа</button>
                </div>
                <div class="chats-list" id="chats-list"></div>
            </aside>

            <main class="chat-main">
                <div class="chat-header" id="chat-header">
                    <button id="back-to-chats-btn" class="mobile-back-btn" style="display: none;"><i class="fas fa-arrow-left"></i></button>
                    <button id="export-chat-btn" class="icon-btn" style="display: none;" title="Экспорт чата"><i class="fas fa-download"></i></button>
                    <div class="chat-title" id="chat-title">Выберите чат</div>
                    <div class="chat-actions">
                        <button id="delete-chat-btn" class="icon-btn" style="display: none;" title="Удалить чат"><i class="fas fa-trash-alt"></i></button>
                        <button id="search-messages-btn" class="icon-btn" style="display: none;" title="Поиск"><i class="fas fa-search"></i></button>
                        <div class="connection-status" id="connection-status"><i class="fas fa-circle"></i></div>
                        <div class="push-status" id="push-status"><i class="fas fa-bell"></i></div>
                    </div>
                </div>
                <div class="messages-area" id="messages-area"></div>
                <div class="message-input-area" id="message-input-area" style="display: none;">
                    <input type="text" id="message-text" placeholder="Введите сообщение..." autocomplete="off" dir="ltr">
                    <div class="input-buttons">
                        <label class="icon-btn" id="attach-btn"><i class="fas fa-paperclip"></i><input type="file" id="file-input" multiple style="display: none;"></label>
                        <button id="mic-btn" class="icon-btn"><i class="fas fa-microphone"></i></button>
                        <button id="send-btn" class="primary-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div id="file-preview" class="file-preview"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальные окна -->
    <!-- Создание группы -->
    <div id="group-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать группу</h3>
                <button class="close-modal">&times;</button>
            </div>
            <input type="text" id="group-name" placeholder="Название группы">
            <input type="text" id="user-search" placeholder="Поиск пользователей...">
            <div id="search-results" class="search-results"></div>
            <div class="selected-users">
                <h4>Участники:</h4>
                <div id="selected-users-list"></div>
            </div>
            <div class="modal-footer">
                <button id="create-group-confirm" class="primary-btn">Создать</button>
            </div>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Настройки</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="settings-item">
                <label>Тема:</label>
                <select id="theme-select">
                    <option value="light">Светлая</option>
                    <option value="dark">Тёмная</option>
                    <option value="cyberpunk">Киберпанк</option>
                    <option value="retro">Ретро</option>
                    <option value="oled">OLED (экономия)</option>
                </select>
            </div>
            <div class="settings-item">
                <label>Уведомления:</label>
                <button id="request-push-btn" class="secondary-btn">Разрешить уведомления</button>
            </div>
            <div class="settings-item">
                <label>Автоскачивание медиа:</label>
                <select id="auto-download">
                    <option value="always">Всегда</option>
                    <option value="wifi">Только Wi-Fi</option>
                    <option value="never">Никогда</option>
                </select>
            </div>
            <div class="settings-item">
                <label>Предпросмотр изображений:</label>
                <select id="image-preview">
                    <option value="always">Всегда</option>
                    <option value="wifi">Только Wi-Fi</option>
                    <option value="never">Никогда</option>
                </select>
            </div>
            <div class="settings-item">
                <label><input type="checkbox" id="markdown-toggle"> Поддержка Markdown</label>
            </div>
            <div class="settings-item">
                <label>Импорт темы (CSS):</label>
                <input type="file" id="theme-file" accept=".css">
                <button id="import-theme-btn" class="secondary-btn">Применить</button>
            </div>
        </div>
    </div>

    <!-- Поиск сообщений -->
    <div id="search-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Поиск сообщений</h3>
                <button class="close-modal">&times;</button>
            </div>
            <input type="text" id="search-query" placeholder="Введите текст...">
            <div id="search-results-list" class="search-results"></div>
        </div>
    </div>

    <!-- Профиль -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Профиль</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="settings-item">
                <label>Аватар:</label>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div id="profile-avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; background: #ccc; overflow: hidden;">
                        <img id="profile-avatar-img" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <input type="file" id="avatar-upload" accept="image/*">
                    <button id="upload-avatar-btn" class="secondary-btn">Загрузить</button>
                </div>
            </div>
            <div class="settings-item">
                <label>Имя:</label>
                <input type="text" id="profile-first-name">
            </div>
            <div class="settings-item">
                <label>Фамилия:</label>
                <input type="text" id="profile-last-name">
            </div>
            <div class="settings-item">
                <label>Никнейм (@):</label>
                <input type="text" id="profile-nickname">
            </div>
            <div class="settings-item">
                <label>Год рождения:</label>
                <input type="number" id="profile-birth-year">
            </div>
            <div class="modal-footer">
                <button id="save-profile-btn" class="primary-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Timeline -->
    <div id="timeline-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>История подключений</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div id="timeline-list" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <div id="panel-overlay" class="panel-overlay" style="display: none;"></div>
    <div id="context-menu" class="context-menu" style="display: none;">
        <button class="context-edit">✏️ Редактировать</button>
        <button class="context-delete">🗑️ Удалить</button>
    </div>

    <div id="terminal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; font-family: monospace; flex-direction: column; z-index: 10000;">
        <div id="terminal-output" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
        <input id="terminal-input" type="text" style="background: #000; color: #0f0; border: none; padding: 10px; outline: none; font-family: monospace;" placeholder="Введите команду...">
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
